name: Validate team handoffs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m contracts.validate
      - run: python -m unittest discover -s e_platform/tests -v
      - run: PYTHON=python bash scripts/run_pipeline.sh --mock
      - run: docker compose config --quiet

  live-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r e_platform/requirements-live.txt
      - run: python -m unittest a_data.tests.test_live_continuity e_platform.tests.test_live_service d_frontend.test_serve_demo -v
      - run: node d_frontend/test_data.cjs
      - run: node d_frontend/test_status.cjs
      - run: node d_frontend/test_live_refresh.cjs
