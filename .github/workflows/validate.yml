name: Validate team handoffs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m contracts.validate
      - run: python -m unittest discover -s e_platform/tests -v
      - run: PYTHON=python bash scripts/run_pipeline.sh --mock
      - run: docker compose config --quiet
